name: Rule check

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BRANCH_PATTERN: '^(feature|fix|hotfix|docs|chore|ci|refactor|test|perf|release)/[a-z0-9._-]+$|^dependabot/'
  CONVENTIONAL_PATTERN: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/._-]+\))?!?: .+'

jobs:
  rules:
    name: Rule check
    runs-on: ubuntu-latest
    steps:
      # PR title and branch name are user-controlled: they are
      # only passed through env vars, never interpolated into the script.
      - name: Check branch name and PR title
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0

          if ! grep -Eq "$BRANCH_PATTERN" <<<"$HEAD_REF"; then
            echo "::error::Branch '$HEAD_REF' must match feature/<desc>, fix/<desc>, docs/<desc>, ..."
            fail=1
          fi

          if ! grep -Eq "$CONVENTIONAL_PATTERN" <<<"$PR_TITLE"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(api): handle empty path'"
            fail=1
          fi

          exit $fail
