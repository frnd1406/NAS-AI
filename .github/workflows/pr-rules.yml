name: Rule check

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Commit authors allowed on main. Add further addresses here if needed.
  ALLOWED_AUTHOR_EMAILS: >-
    226513012+frnd1406@users.noreply.github.com
    49699333+dependabot[bot]@users.noreply.github.com
  BRANCH_PATTERN: '^(feature|fix|hotfix|docs|chore|ci|refactor|test|perf|release)/[a-z0-9._-]+$|^dependabot/'
  CONVENTIONAL_PATTERN: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/._-]+\))?!?: .+'

jobs:
  rules:
    name: Rule check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # PR title, branch name and commit metadata are user-controlled: they are
      # only passed through env vars, never interpolated into the script.
      - name: Check branch, title and commits
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0

          if ! grep -Eq "$BRANCH_PATTERN" <<<"$HEAD_REF"; then
            echo "::error::Branch '$HEAD_REF' must match feature/<desc>, fix/<desc>, docs/<desc>, ..."
            fail=1
          fi

          if ! grep -Eq "$CONVENTIONAL_PATTERN" <<<"$PR_TITLE"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(api): handle empty path'"
            fail=1
          fi

          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format=%ae "$sha")
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")
            short=${sha:0:7}

            if ! grep -qxF "$email" <<<"$(tr ' ' '\n' <<<"$ALLOWED_AUTHOR_EMAILS")"; then
              echo "::error::$short: author '$email' is not allowed; use your GitHub noreply address"
              fail=1
            fi
            if ! grep -Eq "$CONVENTIONAL_PATTERN" <<<"$subject"; then
              echo "::error::$short: subject '$subject' is not a Conventional Commit"
              fail=1
            fi
            if grep -Eiq '^(co-authored-by|claude-session):' <<<"$body"; then
              echo "::error::$short: co-author/attribution trailers are not allowed"
              fail=1
            fi
          done

          exit $fail
