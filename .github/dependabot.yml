version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/orchestrator"
      - "/infrastructure/api"
      - "/infrastructure/monitoring"
      - "/infrastructure/pentester"
      - "/infrastructure/analysis"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: pip
    directory: "/infrastructure/ai_knowledge_agent"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories:
      - "/infrastructure/api"
      - "/infrastructure/monitoring"
      - "/infrastructure/pentester"
      - "/infrastructure/analysis"
      - "/infrastructure/ai_knowledge_agent"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: [ "*" ]
